[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests/e2e"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 99
target-version = "py312"
select = ["E", "F", "W", "I", "N", "S", "B", "UP"]
ignore = ["S101"]   # assert is OK in tests

[tool.ruff.per-file-ignores]
"backend/tests/*" = ["S", "E501"]
